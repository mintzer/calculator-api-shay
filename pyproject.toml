[project]
name = "calculator-api"
version = "0.1.0"
description = "A simple calculator REST API"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<3.2",
    "Flask-SQLAlchemy>=3.1,<3.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["app", "core"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
